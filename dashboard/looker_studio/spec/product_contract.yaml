# Product-layer contract for the published Looker Studio report.
#
# spec/chart_manifest.yaml remains the immutable translation of the pinned
# community Looker block. This file records intentional product behavior and
# live-report fixes that differ from that source snapshot.
meta:
  contract_version: 1
  review_issue: GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK#377
  source_parity_contract: spec/chart_manifest.yaml
  live_review_date: "2026-07-27"
  report_id: 5a3f85ef-fc9c-4730-8ef2-8ef9129ddb40

source:
  mode: BASE_TABLE
  object_default: agent_events
  generated_views_required: false
  data_source_count: 1

defaults:
  date_range:
    mode: rolling
    start_offset_days: 364
    end_offset_days: 0
    include_today: true
    page_scope: all_dashboard_pages

pages:
  - name: Token Consumption
    id: p_70hoa89q5d
  - name: Agent & Sessions
    id: JjD
  - name: Tool Usage
    id: KjD
  - name: LLM Interactions
    id: MjD
  - name: User Analytics
    id: 00IH
  - name: Latency
    id: p_9om48zps5d
  - name: Errors
    id: v0IH
  - name: Trace Inspector
    id: BKJH

layout:
  page_heading:
    present_on_every_page: true
    left: 68
    top_range: [43, 45]
  date_control:
    present_on_dashboard_pages: true
    left: 825
    top_range: [43, 45]
  scorecard_start:
    left: 68
    top_range: [130, 132]
  percentile_order:
    llm: [P50, P75, P90, P99]
    tool: [P50, P75, P90, P99]
  latency_sections:
    llm_percentile_top: 377
    tool_percentile_top: 494
    trend_title_top: 611
    trend_chart_top: 670
    overlap_free: true
  page_bounds:
    minimum_bottom_padding_px: 24
    acceptance_rule: component_top_plus_height_lte_page_height_minus_bottom_padding
    coordinate_space: page_local_css_px
    verification_status: verified
    verified_date: "2026-07-29"
    tracking_issue: GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK#388
    pages:
      - name: Token Consumption
        page_height: 1030
        max_component_bottom: 999
        bottom_padding: 31
      - name: Latency
        page_height: 1100
        max_component_bottom: 1070
        bottom_padding: 30

behavioral_fixes:
  usage-llm-call-trends:
    dimension: event_date
    oracle_grain: minute
    compare_at: event_date
    reason: Raw timestamp exceeded the Looker Studio chart row limit.
  usage-events-by-agent:
    event_scope: TOOL_COMPLETED
    display_title: Tool Completions by Agent
  tool-completed-charts:
    filter_name: Tool completed rows
    event_scope: TOOL_COMPLETED
    charts:
      - usage-tool-invocations
      - usage-tool-calls-over-time
      - performance-tool-latency-trend
    reason: >-
      Excluding non-completed event rows removes blank and null tool-name
      categories while preserving the pinned query semantics.

filtering:
  filter_bar:
    enabled: true
    available_fields:
      - agent
      - user_id
      - trace_id
      - span_id
      - session_id
      - model_version
  date_controls:
    apply_to_all_charts_on_page: true
  predefined_tool_name_control:
    status: intentionally_not_published
    reason: >-
      A report-wide tool_completed_name filter would exclude TOOL_ERROR rows,
      while tool_error_name would exclude TOOL_COMPLETED rows. A unified
      tool_name source field and page-scoped control are required before this
      control can be correct.
  user_id:
    status: available_in_filter_bar
    applies_to_all_compatible_charts: true
  top_user_rankings:
    group_remaining_as_others: false
    charts:
      - usage-top-5-users-with-most-tokens-consumption
      - usage-top-5-users-with-most-traces
      - usage-top-5-users-by-session
      - usage-top-5-users-by-events

visual_system:
  single_series:
    mode: google_blue
    color: "#4285f4"
    legend: hidden_when_title_defines_metric
  multi_series:
    mode: categorical_google_palette
    legend: visible
    dimension_values_are_series_labels: true
  semantic_palette:
    status: deferred
    reason: >-
      The live report uses a categorical palette only to distinguish
      breakdown values. A cross-chart semantic palette should be introduced
      only with contrast and color-blind testing.
  chart_titles:
    present_for_all_non_scorecard_charts: true
    title_case: true
    unit_style: "(ms)"

viewer_qa:
  # Bar, time-series, scorecard, and table components use Looker Studio's native
  # chart implementation. usercontent.goog render frames are not evidence of
  # a third-party or Vega community visualization.
  chart_implementation: native_data_studio
  community_visualizations: not_used
  completion_signal: non_degenerate_rendered_output
  cold_load_timeout_seconds: 90
  fresh_load_runs: 3
  navigation_loops: 3
  # Observational evidence from one browser/viewport, not an SLA. Future
  # verification records its own environment and timings.
  observed_baseline:
    verified_date: "2026-07-27"
    viewport_width_css_px: 1568
    cold_load:
      blank_observed_at_seconds: 40
      fully_rendered_by_seconds: 70
      cache_state: view_miss
    warm_navigation:
      return_rendered_within_seconds: 10
      second_page_rendered_within_seconds: 18
    network:
      usercontent_goog_requests: 0
      community_visualization_requests: 0
  required_evidence:
    - browser_and_version
    - signed_in_state
    - viewport_css_pixels
    - load_type
    - page_navigation_sequence
    - time_to_non_degenerate_render
    - timestamped_page_capture
    - failed_network_requests
    - bigquery_job_activity

viewport_support:
  layout_mode: freeform
  target: desktop
  minimum_supported_width_css_px: 1280
  recommended_width_css_px: 1440
  narrow_screen_support: not_supported_in_v1
  responsive_template: separate_report_required
  minimum_width_validation: pending
  last_validated_width_css_px: 1568

