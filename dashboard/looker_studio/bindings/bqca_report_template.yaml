# Looker Studio template metadata for the BQCA profile (BigQuery
# Conversational Analytics / Conversational Analytics API data agents with
# Prompt & Response Logging enabled). Consumed by:
#   * tools/hydrate_dashboard.py --profile bqca;
#   * tools/render_web_config.py -> docs/report-config.mjs profiles.bqca, which
#     drives the configurator toggle, ?profile=bqca, and the /bqca/ page.
#
# Points at the dedicated 7-page tool-free BQCA Looker Studio template
# provisioned via LegoMidtierService over sql/bqca_events_v1.template.sql
# (report_id 1ffb0888-20ea-451f-aeb8-69fc37973335, data source alias ds0).
# Tool-related pages, scorecards, and charts from the ADK template are omitted.
report_id: 1ffb0888-20ea-451f-aeb8-69fc37973335
data_source_alias: ds0
datasource_id: 4f17a2b4-f79a-4a52-aaa1-5f65e49ca1cc
default_report_name: BigQuery Conversational Analytics (BQCA)
default_table: bqca_prompt_response_logs
datasource_name_prefix: BQCA
template_sql: sql/bqca_events_v1.template.sql
custom_query_template: sql/bqca_events_v1.template.sql
product_contract: spec/bqca_product_contract.yaml
credential_mode: VIEWERS
published_date: "2026-10-08"
reviewed_template_sql:
  path: sql/bqca_events_v1.template.sql
  sha256: be4571cb9eb0529913a4c3c9ea6c135711e8570a9fbdb3c8b03cd955627416ed
# Invariants of the embedded BlockDatasource (data source alias ds0). The
# reviewed SQL reads @DS_START_DATE and @DS_END_DATE through
# PARSE_DATE('%Y%m%d', ...), so the published data source must declare both
# parameters (parameter_configuration) and type its date fields natively
# (use_datetime_type). The template as found before the 2026-10-08 in-place
# republish had neither and embedded PARSE_DATE('%Y%m%d', '') in place of the
# parameters, which BigQuery cannot parse; the report showed "User
# Configuration Error". Re-provisioning or republishing must keep every value
# below and must never replace a date parameter with ''.
# spec/bqca_product_contract.yaml records the same invariants as the normative
# contract, and tests/test_looker_studio_dashboard.py fails if either file or
# the SQL drifts from them.
block_datasource:
  use_datetime_type: true
  parameter_configuration:
    - DS_START_DATE
    - DS_END_DATE
  fields:
    _event_date_:
      data_type: DATE
      semantic_type: YEAR_MONTH_DAY
    _timestamp_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_SECOND
    _event_hour_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_HOUR
# Live evidence for the 2026-10-08 in-place republish of the embedded data
