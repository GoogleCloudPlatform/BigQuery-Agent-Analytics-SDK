# Report visual mapping spec for the Power BI PBIR report.
# Derived from the Looker Studio chart_manifest.yaml and product_contract.yaml.
# See spec.md §5 for the normative design.

canvas:
  page_width: 1280
  margin: 16
  gutter: 8
  column_unit: 52
  row: 40
  body_top: 128
  min_height: 720
  bottom_padding: 24
pages:
- name: token-consumption
  display_name: Token Consumption
  looker_page_id: p_70hoa89q5d
  height: 720
- name: agent-and-sessions
  display_name: Agent & Sessions
  looker_page_id: JjD
  height: 1464
- name: tool-usage
  display_name: Tool Usage
  looker_page_id: KjD
  height: 720
- name: llm-interactions
  display_name: LLM Interactions
  looker_page_id: MjD
  height: 720
- name: user-analytics
  display_name: User Analytics
  looker_page_id: 00IH
  height: 784
- name: latency
  display_name: Latency
  looker_page_id: p_9om48zps5d
  height: 1184
- name: errors
  display_name: Errors
  looker_page_id: v0IH
  height: 720
- name: trace-inspector
  display_name: Trace Inspector
  looker_page_id: BKJH
  height: 720
slicers:
- name: slicer-date
  field: Date.Date
  display_name: Date
  sync_group: bqaa-date
  mode: Between
- name: slicer-agent
  field: events_v1.agent
  display_name: Agent
  sync_group: bqaa-agent
  mode: Dropdown
- name: slicer-user-id
  field: events_v1.user_id
  display_name: User ID
  sync_group: bqaa-user-id
  mode: Dropdown
- name: slicer-trace-id
  field: events_v1.trace_id
  display_name: Trace ID
  sync_group: bqaa-trace-id
  mode: Dropdown
- name: slicer-span-id
  field: events_v1.span_id
  display_name: Span ID
  sync_group: bqaa-span-id
  mode: Dropdown
report_filters:
- name: bqaa-report-window
  field: Date.Window
  type: Categorical
  hidden: true
  locked: true
  values:
  - Current
- name: bqaa-session-id
  field: events_v1.session_id
  type: Categorical
  hidden: false
  locked: false
- name: bqaa-model-version
  field: events_v1.model_version
  type: Categorical
  hidden: false
  locked: false

# 37 parity visuals keyed by chart id.  Each entry maps the manifest
# chart to a Power BI visual type, roles, measures, and geometry.
parity_visuals:
- id: usage-total-tokens
  page: token-consumption
  title: Total Tokens
  visual_type: cardVisual
  measures:
  - KPI Total Tokens
  - KPI Total Tokens Change %
  geometry:
    row: 0
    col: 0
    width: 9
    height: 5
  listens_user_id: true
- id: usage-total-tokens-consumption-over-the-time
  page: token-consumption
  title: Token Consumption Over Time
  visual_type: areaChart
  axis: Date.Date
  measures:
  - Total Tokens
  geometry:
    row: 0
    col: 9
    width: 15
    height: 5
  listens_user_id: true
- id: usage-top-5-users-with-most-tokens-consumption
