# Trace Inspector table on the trace-inspector page.  The first 7 columns are
# the Looker Studio parity set; the rest are debugging columns (README D12).
trace_inspector:
  name: trace-inspector-table
  page: trace-inspector
  columns:
  - events_v1.timestamp
  - events_v1.event_type
  - events_v1.agent
  - events_v1.user_id
  - events_v1.session_id
  - events_v1.trace_id
  - events_v1.span_id
  - events_v1.status
  - events_v1.model_version
  - events_v1.tool_completed_name
  - events_v1.tool_error_name
  - events_v1.usage_total_tokens
  - events_v1.llm_total_ms
  - events_v1.tool_completed_total_ms
  - events_v1.error_message
  geometry:
    row: 0
    col: 0
    width: 24
    height: 14
  sort:
    field: events_v1.timestamp
    direction: Descending

# Header controls repeated on every page (README D17).  Positions live in
# pbip_common.HEADER_RECTS, in the free band right of the page heading.
header_controls:
  reset_filters:
    name: reset-filters
    button_text: Reset filters
    tooltip: Clear all slicers
    fill_color: '#FFFFFF'
    font_color: '#202124'
    outline_color: '#5F6368'

# Drill-through target (README D12): right-click a bar or a day on any page
# -> Drill through -> Trace Inspector, filtered to that member.
drillthrough:
  page: trace-inspector
  binding_name: bqaa-trace-inspector-drillthrough
  fields:
  - Date.Date
  - events_v1.agent
  - events_v1.user_id
  - events_v1.tool_completed_name
  - events_v1.tool_error_name
  back_button:
    name: drillthrough-back
    button_text: Back
    tooltip: Back to the previous page
    fill_color: '#FFFFFF'
    font_color: '#202124'
    outline_color: '#5F6368'

theme:
  name: BQAA
  data_colors:
  - '#4285F4'
  - '#EA4335'
  - '#FBBC04'
  - '#34A853'
  - '#A142F4'
  - '#24C1E0'
  - '#FA903E'
  foreground: '#202124'
  foreground_neutral_secondary: '#5F6368'
  background: '#FFFFFF'
  background_light: '#F8F9FA'
  table_accent: '#4285F4'
  bad: '#C5221F'
