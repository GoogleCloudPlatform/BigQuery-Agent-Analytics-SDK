# 70e5ac1e-65bb-4c89-a9df-fa9990cb6029) and fresh copies
# 920ba558-cc2e-44f9-bc35-96158b3ccb7e
# (9663f7a6-a609-431a-ba31-e27f345d8ea6) and
# 35ebd06d-4d15-4ca9-ad23-0631cbb87ca3
# (180a6d04-ab80-43c0-bf59-c48f3efa90ee). The three capture digests of the
# sync: D0 (revision 1793385843864, 84,190 bytes) SHA-256
