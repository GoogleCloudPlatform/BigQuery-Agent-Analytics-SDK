# BQCA Prompt & Response Logging Looker Studio profile.
#
# Points at the dedicated 7-page tool-free BQCA Looker Studio report template
# (`42e79a1f-a979-4de8-911f-80d5a99543d5`, data source alias `ds0`) whose
# embedded CUSTOM_QUERY is `sql/bqca_events_v1.template.sql` bound to the
# sentinel identifiers in `bindings/bqca_template_bindings.yaml`.
#
# This report is a copy that its owner made on 2026-10-09 of the first
# published BQCA template, whose organization allowed sharing only inside the
# organization. `datasource_id` below is the copy's own embedded
# BlockDatasource, re-recorded on 2026-10-29 from the copy's report
# configuration, which also maps the `ds0` alias to it. On 2026-11-01 (#559),
# the copy's 65 component concepts and report-level `datasource_id` were
# synced from the repository contracts and verified at revision 1793504835696.
# `published_date`, `product_verification`, and the RPC health checks under
# `live_template_verification` below were recorded on the source report (the
# health checks on 2026-10-09); the comments above `live_template_verification`
# date the checks that ran on this report and on fresh copies of it after the
# sync.
report_id: 42e79a1f-a979-4de8-911f-80d5a99543d5
data_source_alias: ds0
datasource_id: 70e5ac1e-65bb-4c89-a9df-fa9990cb6029
product_contract: spec/bqca_product_contract.yaml
chart_manifest: spec/bqca_chart_manifest.yaml
dashboard_template_bundle: spec/bqca_dashboard_template.json
compatibility_profile: spec/bqca_compatibility_profile.json
default_report_name: BigQuery Conversational Analytics (BQCA)
default_table: bqca_prompt_response_logs
datasource_name_prefix: BQCA
custom_query_template: sql/bqca_events_v1.template.sql
published_date: "2026-10-08"
credential_mode: VIEWERS
generated_report_credential_gate:
  observed_initial_mode: OWNERS
  required_before_sharing: VIEWERS
  verification_path: Resource > Manage added data sources > Edit
# Owner-side intent, as in bindings/report_template.yaml: on 2026-10-09 the
# owner turned on link sharing for anyone on the internet with the link. Only
# external_access_verification below can show that an outside account can
# actually copy the report.
link_access: PUBLIC
publishing_mode: MANUAL

reviewed_template_sql:
  path: sql/bqca_events_v1.template.sql
  sha256: c915abe82c9e6d54aac6fffe78e34f90b436e852697c86747632a6c238754096

# Required settings on the published Looker Studio BlockDatasource (`ds0`).
# `_event_date_`, `_timestamp_`, and `_event_hour_` must keep native date/time
# types (`use_datetime_type: true`) and both `@DS_START_DATE` / `@DS_END_DATE`
# parameters must stay enabled; otherwise Looker Studio sends `''` into
# `PARSE_DATE('%Y%m%d', ...)` and fails with "User Configuration Error".
block_datasource:
  use_datetime_type: true
  parameter_configuration:
    - DS_START_DATE
    - DS_END_DATE
  fields:
    _event_date_:
      data_type: DATE
      semantic_type: YEAR_MONTH_DAY
    _timestamp_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_SECOND
    _event_hour_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_HOUR

# Live verification of the published external template (`42e79a1f-a979-4de8-911f-80d5a99543d5`).
# The RPC health checks (`method`, `publish_datasource`, `execute_query`,
# `render_dashboard_pdf`, and `result`) were recorded on 2026-10-09, on the
# source report, after publishing the data source with
# `DS_START_DATE`/`DS_END_DATE` enabled and native date/time types on
# `_event_date_`, `_timestamp_`, and `_event_hour_`. `verified_date` is the day
# of the live sync below, not the date of those checks; the post-sync check
# below gives the dates of the renders and queries that ran on this report and
# on two fresh copies of it after the sync.
# `pages_sha256` pins the canonical JSON digest of `contract["pages"]` (all 7
# pages, 21 scorecards, and 13 charts/tables), `manifest_sha256` pins
# `spec/bqca_chart_manifest.yaml`, and `template_bundle_sha256` pins
# `spec/bqca_dashboard_template.json`, so mutating any component or metric fails CI.
# On 2026-11-01 (`sync_generation: 1`, revision `1793504835696`, #559), the
# live template was synced from these contracts — renaming all 65 concepts of
# its 34 components to the derived `qt_` IDs in `spec/bqca_chart_manifest.yaml`
# and repointing the report-level `datasource_id` to
# `70e5ac1e-65bb-4c89-a9df-fa9990cb6029` — and verified with
# `tools/finalize_live_sync.py` against the signed post-write capture receipt
# committed at `bindings/bqca_live_capture_receipt.json` (`.sig`).
# `verified_manifest_sha256` and `verified_template_bundle_sha256` match
# `manifest_sha256` and `template_bundle_sha256`; if either contract changes
# before the live template is re-synced, `sync_generation` must be incremented
# and `pending_live_sync` re-added until `tools/finalize_live_sync.py` records
# the next live sync. Capture receipts carry `sync_generation`, so
# `tools/validate_contracts.py` rejects a committed receipt of another sync,
# and CI checks that `sync_generation` only moves forward from the binding on
# the base branch (`--previous-binding`).
# Post-sync scorecard check, 2026-11-01 (revision `1793504835696`; dates in US
# Pacific time): the signed capture gives every scorecard its own `qt_`
# concept on its own field (all 65 concepts are distinct; Total, Input,
# Output, Thinking and Cached Tokens are `qt_d779815a`, `qt_c90b69a4`,
# `qt_893d21f1`, `qt_a6d27140` and `qt_31dd80a8`). On 2026-11-01,
