# `use_fresh_schema: false`, `fix_fields: false`,
# `connector_block_config.alias: "t0"` and `use_datetime_type: true`, which
# keep the template's published `BlockDatasource` schema and its
# `DS_START_DATE` and `DS_END_DATE` parameters), created fresh copy
