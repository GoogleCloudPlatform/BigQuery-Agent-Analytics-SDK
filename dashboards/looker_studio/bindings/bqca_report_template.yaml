# BQCA Prompt & Response Logging Looker Studio profile.
#
# Points at the dedicated 7-page tool-free BQCA Looker Studio report template
# (`42e79a1f-a979-4de8-911f-80d5a99543d5`, data source alias `ds0`) whose
# embedded CUSTOM_QUERY is `sql/bqca_events_v1.template.sql` bound to the
# sentinel identifiers in `bindings/bqca_template_bindings.yaml`.
#
# This report is a copy that its owner made on 2026-10-09 of the first
# published BQCA template, whose organization allowed sharing only inside the
# organization. `datasource_id`, `published_date`, `live_template_verification`
# and `product_verification` below were recorded on that source report and
# have not been re-recorded for the copy; the copy's `ds0` alias has not been
# re-checked either.
report_id: 42e79a1f-a979-4de8-911f-80d5a99543d5
data_source_alias: ds0
datasource_id: 4f17a2b4-f79a-4a52-aaa1-5f65e49ca1cc
product_contract: spec/bqca_product_contract.yaml
chart_manifest: spec/bqca_chart_manifest.yaml
dashboard_template_bundle: spec/bqca_dashboard_template.json
compatibility_profile: spec/bqca_compatibility_profile.json
default_report_name: BigQuery Conversational Analytics (BQCA)
default_table: bqca_prompt_response_logs
datasource_name_prefix: BQCA
custom_query_template: sql/bqca_events_v1.template.sql
published_date: "2026-10-08"
credential_mode: VIEWERS
generated_report_credential_gate:
  observed_initial_mode: OWNERS
  required_before_sharing: VIEWERS
  verification_path: Resource > Manage added data sources > Edit
# Owner-side intent, as in bindings/report_template.yaml: on 2026-10-09 the
# owner turned on link sharing for anyone on the internet with the link. Only
# external_access_verification below can show that an outside account can
# actually copy the report.
link_access: PUBLIC
publishing_mode: MANUAL

reviewed_template_sql:
  path: sql/bqca_events_v1.template.sql
  sha256: c915abe82c9e6d54aac6fffe78e34f90b436e852697c86747632a6c238754096

# Required settings on the published Looker Studio BlockDatasource (`ds0`).
# `_event_date_`, `_timestamp_`, and `_event_hour_` must keep native date/time
# types (`use_datetime_type: true`) and both `@DS_START_DATE` / `@DS_END_DATE`
# parameters must stay enabled; otherwise Looker Studio sends `''` into
# `PARSE_DATE('%Y%m%d', ...)` and fails with "User Configuration Error".
block_datasource:
  use_datetime_type: true
  parameter_configuration:
    - DS_START_DATE
    - DS_END_DATE
  fields:
    _event_date_:
      data_type: DATE
      semantic_type: YEAR_MONTH_DAY
    _timestamp_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_SECOND
    _event_hour_:
      data_type: TIMESTAMP
      semantic_type: YEAR_MONTH_DAY_HOUR

# Live verification of the published external template on 2026-10-09 after
# publishing the data source with `DS_START_DATE`/`DS_END_DATE` enabled and
# native date/time types on `_event_date_`, `_timestamp_`, and `_event_hour_`.
# `pages_sha256` pins the canonical JSON digest of `contract["pages"]` (all 7
# pages, 21 scorecards, and 13 charts/tables), `manifest_sha256` pins
# `spec/bqca_chart_manifest.yaml`, and `template_bundle_sha256` pins
# `spec/bqca_dashboard_template.json`, so mutating any component or metric fails CI.
# The evidence was gathered on the source report this template was copied
# from (see the note at the top); the digests were re-pinned on 2026-10-09
# only because the report ID in the manifest and bundle changed.
live_template_verification:
  verified_date: "2026-10-09"
  repository_sql_sha256: c915abe82c9e6d54aac6fffe78e34f90b436e852697c86747632a6c238754096
  pages_sha256: b3c14c7dfc8ed51690f7f3e0ac6d24506c31dc63038591f479c51362715a89c4
  manifest_sha256: a6b4effd99d59097d3c014cf6242a4f2750da8622e7ad71a03b8f5585a486054
  template_bundle_sha256: 2631f878a9c382b0a81ab94347b434a7a8666fa2eae75844c86fca48216eb347
  method:
    - data_studio_web_service_publish_datasource
    - data_studio_web_service_get_block_datasource
    - lego_midtier_service_execute_query
    - lego_midtier_service_render_dashboard_pdf
  publish_datasource:
    health: HEALTHY
    versions:
      hydrated_bqca_table: 1791578476993
      canonical_sentinel_table: 1791578549613
  execute_query:
    # hydrated_bqca_table is a sanitized live BQCA Prompt & Response Logging
    # table conforming to the 15-column BQAA base schema with recent events
    # inside the default rolling 90-day window (default_dates).
    # canonical_sentinel_table is a static historical fixture whose event
    # timestamps predate the rolling 90-day window, so default_dates returns
    # 0 bytes while 20200101..20261231 returns 57,891 bytes.
    hydrated_bqca_table:
      schema: bqaa_base_table_15_columns
      date_range: default_dates
      code: 0
      pages:
        - p_539b9240
        - p_a89cfece
        - p_97efe693
        - p_edf06c14
        - p_08774fec
        - p_88bcf5f8
        - p_b87a335e
      non_empty: true
    canonical_sentinel_table:
      - date_range: default_dates
        code: 0
        size: 0
      - date_range: "20200101..20261231"
        code: 0
        size: 57891
  render_dashboard_pdf:
    hydrated_bqca_table:
      code: 0
      contains_user_configuration_error: false
  result: PASSED
  limitation: mutable_external_report_requires_reverification_after_changes

# External link-access attestation for the dedicated BQCA report template
# (`42e79a1f-a979-4de8-911f-80d5a99543d5`), structured identically to
# `bindings/report_template.yaml` so `scripts/check_external_access_staleness.py`
# can extract `next_due_date`, `status`, and `tracking_issue` without PyYAML.
# Neither control has run against this report yet (`NOT_RUN`), so
# `link_access_verified_date` stays null and `status` stays
# PENDING_EXTERNAL_IDENTITY_CHECK until a signed-in outside account passes the
# copy canary. An anonymous HTTP fetch is no substitute: it gets the same
# sign-in redirect for this report as for a nonexistent report ID.
external_access_verification:
  controls:
    - method: permissions_api_link_role_check
      protocol: >-
        Authenticated GET
        https://datastudio.googleapis.com/v1/assets/{report_id}/permissions
        must list role LINK_VIEWER with member allUsers. Call it from a
        Google Workspace or Cloud Identity account holding the
        datastudio.readonly OAuth scope (least privilege for this read).
        Treat PERMISSION_DENIED as indeterminate: it can mean a caller
        constraint (non-org account, missing scope) or lost asset
        authorization, so verify the principal, its organization
        authorization, and the scope before reading a denial as either.
      limitation: does_not_expose_viewer_copy_disable_control
      last_observed_date: null
      last_result: NOT_RUN
    - method: external_identity_link_access_check
      protocol: >-
        From a signed-in, non-owner, out-of-domain Google account holding no
        direct grant on the report — either a personal account, or a managed
        account whose Workspace policy is recorded as allowing Looker Studio
        assets from untrusted external domains (recipient-side policy can
        block a fully public template, which would misread as an owner-side
        outage) — open
        /reporting/create?c.reportId={report_id}&c.mode=view&c.explain=true
        and confirm it reaches the Linking API copy/review flow rather than
        the terminal "This report isn't shared with you" dialog. Record
        last_observed_date and last_identity_class on every run, pass or
        fail. On failure, record privately which Google account the dialog
        selected before changing any setting; never post account identifiers
        publicly.
      last_identity_class: unknown
      last_observed_date: null
      link_access_verified_date: null
      last_result: NOT_RUN
  cadence: monthly_manual_until_automated
  # The first canary run against this report is due by this date.
  next_due_date: "2026-11-08"
  status: PENDING_EXTERNAL_IDENTITY_CHECK
  tracking_issue: GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK#515

known_live_issues:
  - issue: GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK#515
    symptom: >-
      The 1-click Linking API copy of the dedicated 7-page BQCA template was
      not available to external non-owner identities: the first published
      report allowed sharing only inside its owner's organization, so public
      link sharing (`allUsers` LINK_VIEWER) could not be turned on for it.
    scope: external_non_owner_identities
    reported_date: "2026-10-08"
    cause_isolation: >-
      Owner-side provisioning, 41-field BlockDatasource native date/time
      remediation, and all 7 pages / 34 components passed live verification
      on the source report (product_verification 2026-10-08,
      live_template_verification 2026-10-09). On 2026-10-09 its owner copied
      it to `42e79a1f-a979-4de8-911f-80d5a99543d5` in an account that permits
      public sharing and turned on link sharing for anyone with the link. The
      external-identity copy canary has not run against the copy yet, and
      transfer to Google-managed ownership is still pending. Until the canary
      passes, external users who see "This report isn't shared with you" can
      run the Self-Hosted Streamlit BQCA Dashboard (`dashboards/streamlit/`)
      or export the bound custom query via
      `hydrate_dashboard.py --profile bqca --custom-sql-out`.
    status: OPEN

