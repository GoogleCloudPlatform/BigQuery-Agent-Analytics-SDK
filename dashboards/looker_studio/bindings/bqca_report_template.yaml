# `9663f7a6-a609-431a-ba31-e27f345d8ea6`) for canonical_sentinel_table and
# fresh copy `35ebd06d-4d15-4ca9-ad23-0631cbb87ca3` (data source
# `180a6d04-ab80-43c0-bf59-c48f3efa90ee`) for hydrated_bqca_table (13,054 rows
# from 2026-07-31 to 2026-10-22), each with all 65 distinct `qt_` concepts.
