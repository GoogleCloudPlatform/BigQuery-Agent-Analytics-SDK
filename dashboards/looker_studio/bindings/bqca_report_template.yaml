# External link-access attestation for the dedicated BQCA report template
# (`42e79a1f-a979-4de8-911f-80d5a99543d5`), structured identically to
# `bindings/report_template.yaml` so `scripts/check_external_access_staleness.py`
# can extract `next_due_date`, `status`, and `tracking_issue` without PyYAML.
# Neither control has run against this report yet (`NOT_RUN`), so
# `link_access_verified_date` stays null and `status` stays
# PENDING_EXTERNAL_IDENTITY_CHECK until a signed-in outside account passes the
# copy canary. An anonymous HTTP fetch is no substitute: it gets the same
# sign-in redirect for this report as for a nonexistent report ID.
external_access_verification:
  controls:
    - method: permissions_api_link_role_check
      protocol: >-
        Authenticated GET
        https://datastudio.googleapis.com/v1/assets/{report_id}/permissions
        must list role LINK_VIEWER with member allUsers. Call it from a
        Google Workspace or Cloud Identity account holding the
        datastudio.readonly OAuth scope (least privilege for this read).
        Treat PERMISSION_DENIED as indeterminate: it can mean a caller
        constraint (non-org account, missing scope) or lost asset
        authorization, so verify the principal, its organization
        authorization, and the scope before reading a denial as either.
      limitation: does_not_expose_viewer_copy_disable_control
      last_observed_date: null
      last_result: NOT_RUN
    - method: external_identity_link_access_check
      protocol: >-
        From a signed-in, non-owner, out-of-domain Google account holding no
        direct grant on the report — either a personal account, or a managed
        account whose Workspace policy is recorded as allowing Looker Studio
        assets from untrusted external domains (recipient-side policy can
        block a fully public template, which would misread as an owner-side
        outage) — open
        /reporting/create?c.reportId={report_id}&c.mode=view&c.explain=true
        and confirm it reaches the Linking API copy/review flow rather than
        the terminal "This report isn't shared with you" dialog. Record
        last_observed_date and last_identity_class on every run, pass or
        fail. On failure, record privately which Google account the dialog
        selected before changing any setting; never post account identifiers
        publicly.
      last_identity_class: unknown
      last_observed_date: null
      link_access_verified_date: null
      last_result: NOT_RUN
  cadence: monthly_manual_until_automated
  # The first canary run against this report is due by this date.
  next_due_date: "2026-11-08"
  status: PENDING_EXTERNAL_IDENTITY_CHECK
  tracking_issue: GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK#515

