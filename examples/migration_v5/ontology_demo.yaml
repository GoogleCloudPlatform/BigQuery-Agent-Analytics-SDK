# Copyright 2026 Google LLC
#
# Demo-subset of the MAKO ontology (https://ontology.yahoo.com/mako/).
# Source: examples/migration_v5/mako_core.ttl
#
# The auto-import via ``gm import-owl mako_core.ttl --include-namespace
# https://ontology.yahoo.com/mako/`` produces a full 41-entity
# ontology.yaml (see examples/migration_v5/ontology.yaml) with
# FILL_IN placeholders for the 17 concrete entities that don't
# declare ``owl:hasKey`` in MAKO's source TTL. This file is the
# **hand-curated demo subset**: 5 entities + 4 relationships
# from MAKO's decision-flow core (a session contains decision
# points; each picks among candidates against a context;
# selection produces an outcome). FILL_IN resolved to ``id``
# (a generated UUID string) for every entity — matches MAKO's
# "every artifact has a stable identifier" design contract.
#
# The other 36 entities in MAKO would scaffold the same way;
# this subset keeps the notebook focused on the four-guarantee
# narrative without diluting it across the full surface.

ontology: mako_demo
version: "1.0.0"

entities:

  - name: AgentSession
    description: "A complete agent workflow session, grouping multiple decisions."
    keys:
      primary: [id]
    properties:
      - name: id
        type: string
      - name: sessionId
        type: string
      - name: startedAt
        type: timestamp
    annotations:
      skos:prefLabel: Agent Session
      skos:altLabel: [Session, Workflow Run]
      skos:notation: AGENT_SESSION
      skos:inScheme: [mako_core]

  - name: DecisionPoint
    description: "A point in the workflow where the agent chooses among candidates."
    keys:
      primary: [id]
    properties:
      - name: id
        type: string
      - name: decisionType
        type: string
      - name: decidedAt
        type: timestamp
    annotations:
      skos:prefLabel: Decision Point
      skos:altLabel: [Decision, Choice Point]
      # Two notations in NON-sorted order — exercises the
      # round-3 lex-min display-token rule in the notebook's
      # Beat 4. Lex-min is "DP".
      skos:notation: [DECISION_POINT, DP]
      skos:inScheme: [mako_core]

  - name: Candidate
    description: "An option evaluated at a DecisionPoint."
    keys:
      primary: [id]
    properties:
      - name: id
        type: string
      - name: candidateLabel
        type: string
      - name: score
        type: double
    annotations:
      skos:prefLabel: Candidate
      skos:altLabel: [Option, Alternative]
      skos:notation: CAND
      skos:inScheme: [mako_core]

  - name: SelectionOutcome
    description: "The winning candidate plus rationale for one DecisionPoint."
    keys:
      primary: [id]
    properties:
      - name: id
        type: string
      - name: selectedCandidateId
        type: string
      - name: rationale
        type: string
    annotations:
      skos:prefLabel: Selection Outcome
      skos:altLabel: [Winner, Selection]
      skos:notation: OUTCOME
      skos:inScheme: [mako_core]

  - name: ContextSnapshot
    description: "Point-in-time capture of state relevant to a decision."
    keys:
      primary: [id]
    properties:
      - name: id
        type: string
      - name: snapshotPayload
        type: string
      - name: snapshotTimestamp
        type: timestamp
    annotations:
      skos:prefLabel: Context Snapshot
      skos:altLabel: [Context, State Capture]
      skos:notation: CTX
      skos:inScheme: [mako_core]

relationships:

  - name: containsDecisionPoint
    from: AgentSession
    to: DecisionPoint
    description: "A session contains zero or more decision points."

  - name: hasCandidate
    from: DecisionPoint
    to: Candidate
    description: "Each decision point evaluates one or more candidates."

  - name: hasOutcome
    from: DecisionPoint
    to: SelectionOutcome
    description: "Each decision point produces exactly one outcome."

  - name: hasContext
    from: DecisionPoint
    to: ContextSnapshot
    description: "Each decision point references the context state it was made against."
