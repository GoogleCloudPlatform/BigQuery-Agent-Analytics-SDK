const SQL_TEMPLATES = {
  extractBizNodes: {
    name: 'Extract Business Entities (AI.GENERATE + output_schema)',
    category: 'Extraction',
    sql: `-- AI.GENERATE with strict output_schema for entity extraction
MERGE \`project.dataset.extracted_biz_nodes\` AS target
USING (
  SELECT
    CONCAT(base.span_id, ':', JSON_EXTRACT_SCALAR(entity, '$.entity_type'),
           ':', JSON_EXTRACT_SCALAR(entity, '$.entity_value')
    ) AS biz_node_id,
    base.span_id,
    base.session_id,
    JSON_EXTRACT_SCALAR(entity, '$.entity_type') AS node_type,
    JSON_EXTRACT_SCALAR(entity, '$.entity_value') AS node_value,
    CAST(COALESCE(JSON_EXTRACT_SCALAR(entity, '$.confidence'), '1.0') AS FLOAT64) AS confidence
  FROM \`project.dataset.agent_events\` AS base,
  UNNEST(JSON_EXTRACT_ARRAY(
    AI.GENERATE(
      CONCAT('Extract business entities. Entity types: Product, Targeting, Campaign, Budget.',
             '\\nPayload:\\n', TO_JSON_STRING(base.content)),
      endpoint => 'https://aiplatform.googleapis.com/v1/projects/PROJECT/locations/global/publishers/google/models/gemini-3-flash-preview',
      output_schema => '{"type":"ARRAY","items":{"type":"OBJECT","properties":{"entity_type":{"type":"STRING"},"entity_value":{"type":"STRING"},"confidence":{"type":"NUMBER"}}}}'
    ).result
  )) AS entity
  WHERE base.session_id IN UNNEST(@session_ids)
) AS source
ON target.biz_node_id = source.biz_node_id
WHEN MATCHED THEN UPDATE SET confidence = source.confidence
WHEN NOT MATCHED BY TARGET THEN INSERT (biz_node_id, span_id, session_id, node_type, node_value, confidence)
  VALUES (source.biz_node_id, source.span_id, source.session_id, source.node_type, source.node_value, source.confidence)
WHEN NOT MATCHED BY SOURCE AND target.session_id IN UNNEST(@session_ids) THEN DELETE`,
  },
  propertyGraphDDL: {
    name: 'Property Graph DDL (4-Pillar Architecture)',
    category: 'Graph',
    sql: `-- 4-Pillar Context Graph: Tech Graph + Biz Graph + Cross-Links + Artifacts
CREATE OR REPLACE PROPERTY GRAPH \`project.dataset.agent_context_graph\`
  NODE TABLES (
    -- Pillar 1: Technical execution nodes (from ADK plugin)
    \`project.dataset.agent_events\` AS TechNode
      KEY (span_id)
      LABEL TechNode
      PROPERTIES (event_type, agent, timestamp, session_id, invocation_id,
                  content, latency_ms, status, error_message),

    -- Pillar 2: Business domain nodes (AI.GENERATE extracted)
    \`project.dataset.extracted_biz_nodes\` AS BizNode
      KEY (biz_node_id)
      LABEL BizNode
      PROPERTIES (node_type, node_value, confidence, session_id, span_id, artifact_uri)
  )
  EDGE TABLES (
    -- Causal lineage: parent span -> child span
    \`project.dataset.agent_events\` AS Caused
      KEY (span_id)
      SOURCE KEY (parent_span_id) REFERENCES TechNode (span_id)
      DESTINATION KEY (span_id) REFERENCES TechNode (span_id)
      LABEL Caused,

    -- Pillar 3: Cross-link edges (tech event -> business entity)
    -- Pillar 4: Artifact lineage via artifact_uri property
    \`project.dataset.context_cross_links\` AS Evaluated
      KEY (link_id)
      SOURCE KEY (span_id) REFERENCES TechNode (span_id)
      DESTINATION KEY (biz_node_id) REFERENCES BizNode (biz_node_id)
      LABEL Evaluated
      PROPERTIES (artifact_uri, link_type, created_at)
  )`,
  },
  gqlReasoning: {
    name: 'GQL Reasoning Chain ("Why was X selected?")',
    category: 'Graph',
    sql: `-- GQL: Trace why a business entity was selected
-- Quantified-path traversal from HITL decision back to business inputs
GRAPH \`project.dataset.agent_context_graph\`
MATCH
  (decision:TechNode)-[c:Caused]->{1,20}(step:TechNode)
    -[e:Evaluated]->(biz:BizNode)
WHERE decision.event_type = @decision_event_type
  AND biz.node_value = @biz_entity
RETURN
  TO_JSON(decision) AS decision_node,
  decision.span_id AS decision_span_id,
  step.span_id AS reasoning_span_id,
  step.event_type AS step_type,
  step.agent AS step_agent,
  biz.node_type AS entity_type,
  biz.node_value AS entity_value,
  biz.confidence AS entity_confidence,
  biz.artifact_uri AS artifact_uri
ORDER BY step.timestamp ASC`,
  },
  gqlTraceReconstruction: {
    name: 'GQL Trace Reconstruction (replaces recursive CTEs)',
    category: 'Graph',
    sql: `-- GQL: Native graph traversal replaces recursive CTEs for trace reconstruction
GRAPH \`project.dataset.agent_context_graph\`
MATCH
  (parent:TechNode)-[c:Caused]->(child:TechNode)
WHERE parent.session_id = @session_id
   OR child.session_id = @session_id
RETURN
  parent.span_id AS parent_span_id,
  parent.event_type AS parent_event_type,
  parent.agent AS parent_agent,
  child.span_id AS child_span_id,
  child.event_type AS child_event_type,
  child.agent AS child_agent,
  child.timestamp AS child_timestamp
ORDER BY child.timestamp ASC`,
  },
  worldChangeCheck: {
    name: 'World Change Detection (Fail-Closed)',
    category: 'Safety',
    sql: `-- World Change: Join biz nodes with agent events for evaluated_at timestamp
-- detect_world_changes() is FAIL-CLOSED: query failures => check_failed=True, is_safe_to_approve=False
SELECT
  b.node_type,
  b.node_value,
  b.confidence,
  b.span_id,
  b.artifact_uri,
  e.timestamp AS evaluated_at  -- When the agent originally evaluated this entity
FROM \`project.dataset.extracted_biz_nodes\` b
JOIN \`project.dataset.agent_events\` e
  ON b.span_id = e.span_id
WHERE b.session_id = @session_id
ORDER BY e.timestamp ASC

-- Python SDK usage:
-- report = cgm.detect_world_changes(session_id="sess-1", current_state_fn=check_fn)
-- report.is_safe_to_approve  # False if drift detected OR query failed
-- report.check_failed         # True if underlying query errored (fail-closed)`,
  },
};

  const cm = { blue: { bg: C.blue[50], text: C.blue[500] }, green: { bg: C.green[50], text: C.green[500] }, yellow: { bg: C.yellow[50], text: C.yellow[600] }, red: { bg: C.red[50], text: C.red[500] }, purple: { bg: C.purple[50], text: C.purple[500] }, grey: { bg: C.grey[100], text: C.grey[700] }, orange: { bg: C.orange[50], text: C.orange[500] } };
  const { bg, text } = cm[color] || cm.blue;
  return <span onClick={onClick} style={{ display: 'inline-block', padding: '2px 8px', borderRadius: '12px', background: bg, color: text, fontSize: '11px', fontWeight: 500, cursor: onClick ? 'pointer' : 'default' }}>{children}</span>;
};

// ============================================================

const PropertyGraphViz = ({ session }) => {
  const [selectedNode, setSelectedNode] = useState(null);
  if (!session) return null;

  const techNodes = session.events.map((e, i) => ({
    id: e.span_id, type: 'tech', label: e.event_type.replace(/_/g, ' ').replace(/COMPLETED|STARTING|RECEIVED/g, '').trim(),
    agent: e.agent, x: 80 + (i % 7) * 130, y: 60 + Math.floor(i / 7) * 90,
    color: e.event_type.includes('TOOL') ? C.red[500] : e.event_type.includes('HITL') ? C.yellow[500] : e.event_type.includes('AGENT') ? C.green[500] : e.event_type === 'USER_MESSAGE_RECEIVED' ? C.blue[500] : C.purple[500],
    event: e,
  }));

  const bizNodes = session.bizNodes.map((b, i) => ({
    id: `biz-${b.node_type}-${b.node_value}`, type: 'biz', label: b.node_value,
    nodeType: b.node_type, confidence: b.confidence, artifact_uri: b.artifact_uri,
    x: 80 + (i % 4) * 200, y: 320 + Math.floor(i / 4) * 70,
    color: b.node_type === 'Product' ? C.orange[500] : b.node_type === 'Targeting' ? C.cyan[500] : b.node_type === 'Budget' ? C.green[500] : C.purple[500],
  }));

  const allNodes = [...techNodes, ...bizNodes];
  const nodeMap = new Map(allNodes.map(n => [n.id, n]));

  // Caused edges (parent -> child)
  const causedEdges = session.events.filter(e => e.parent_span_id && nodeMap.has(e.parent_span_id)).map(e => ({ from: e.parent_span_id, to: e.span_id, type: 'Caused', color: C.grey[400] }));

  // Evaluated edges (tool events -> biz nodes they mention)
  const evalEdges = [];
  session.events.filter(e => e.event_type === 'TOOL_COMPLETED' && e.content?.result).forEach(e => {
    session.bizNodes.forEach(b => {
      const resultStr = JSON.stringify(e.content.result);
      if (resultStr.includes(b.node_value) || resultStr.includes(b.node_value.split(' ')[0])) {
        evalEdges.push({ from: e.span_id, to: `biz-${b.node_type}-${b.node_value}`, type: 'Evaluated', color: C.blue[500] });
      }
    });
  });

  return (
    <div>
      <svg width="100%" height="460" style={{ background: C.grey[50], borderRadius: '8px' }}>
        {/* Pillar labels */}
        <text x="16" y="30" fontSize="11" fill={C.grey[500]} fontWeight="500">TECHNICAL GRAPH (ADK Spans)</text>
        <line x1="0" y1="295" x2="100%" y2="295" stroke={C.grey[300]} strokeDasharray="4,4" />
        <text x="16" y="312" fontSize="11" fill={C.grey[500]} fontWeight="500">BUSINESS GRAPH (AI.GENERATE Extracted)</text>

        {/* Caused edges */}
        {causedEdges.map((edge, i) => {
          const from = nodeMap.get(edge.from), to = nodeMap.get(edge.to);
          if (!from || !to) return null;
          return <line key={`c-${i}`} x1={from.x} y1={from.y} x2={to.x} y2={to.y} stroke={edge.color} strokeWidth="1.5" opacity="0.4" />;
        })}

        {/* Evaluated edges (cross-links) */}
        {evalEdges.map((edge, i) => {
          const from = nodeMap.get(edge.from), to = nodeMap.get(edge.to);
          if (!from || !to) return null;
          return <line key={`e-${i}`} x1={from.x} y1={from.y} x2={to.x} y2={to.y} stroke={edge.color} strokeWidth="2" strokeDasharray="6,3" opacity="0.5" />;
        })}

        {/* Tech nodes */}
        {techNodes.map(n => (
          <g key={n.id} transform={`translate(${n.x}, ${n.y})`} onClick={() => setSelectedNode(n)} style={{ cursor: 'pointer' }}>
            {selectedNode?.id === n.id && <circle r="20" fill="none" stroke={C.blue[500]} strokeWidth="3" />}
            <circle r="14" fill={n.color} stroke="white" strokeWidth="2" />
            <text textAnchor="middle" dy="28" fontSize="9" fill={C.grey[700]}>{n.label.substring(0, 12)}</text>
          </g>
        ))}

        {/* Biz nodes (rectangles) */}
        {bizNodes.map(n => (
          <g key={n.id} transform={`translate(${n.x}, ${n.y})`} onClick={() => setSelectedNode(n)} style={{ cursor: 'pointer' }}>
            {selectedNode?.id === n.id && <rect x="-52" y="-18" width="104" height="36" rx="6" fill="none" stroke={C.blue[500]} strokeWidth="3" />}
            <rect x="-48" y="-14" width="96" height="28" rx="4" fill={n.color} stroke="white" strokeWidth="2" />
            <text textAnchor="middle" dy="4" fontSize="9" fill="white" fontWeight="500">{n.label.substring(0, 14)}</text>
          </g>
        ))}

        {/* Legend */}
        <g transform="translate(16, 430)">
          <circle cx="6" cy="0" r="5" fill={C.grey[400]} /><text x="16" y="4" fontSize="9" fill={C.grey[500]}>Caused (span lineage)</text>
          <line x1="140" y1="0" x2="170" y2="0" stroke={C.blue[500]} strokeWidth="2" strokeDasharray="6,3" /><text x="176" y="4" fontSize="9" fill={C.grey[500]}>Evaluated (cross-link)</text>
          <rect x="310" y="-6" width="12" height="12" rx="2" fill={C.orange[500]} /><text x="328" y="4" fontSize="9" fill={C.grey[500]}>Product</text>
          <rect x="380" y="-6" width="12" height="12" rx="2" fill={C.cyan[500]} /><text x="398" y="4" fontSize="9" fill={C.grey[500]}>Targeting</text>
          <rect x="460" y="-6" width="12" height="12" rx="2" fill={C.green[500]} /><text x="478" y="4" fontSize="9" fill={C.grey[500]}>Budget</text>
        </g>
      </svg>

      {selectedNode && (
        <Card style={{ marginTop: '12px', border: `2px solid ${C.blue[200]}` }} title={selectedNode.type === 'tech' ? `TechNode: ${selectedNode.label}` : `BizNode: ${selectedNode.label}`}>
          {selectedNode.type === 'tech' ? (
            <div style={{ fontSize: '12px' }}>
              <div><strong>span_id:</strong> <code>{selectedNode.id}</code></div>
              <div><strong>agent:</strong> {selectedNode.agent}</div>
              <div><strong>event_type:</strong> {selectedNode.event?.event_type}</div>
              {selectedNode.event?.content && <pre style={{ marginTop: '8px', padding: '8px', background: C.grey[50], borderRadius: '4px', fontSize: '11px', overflow: 'auto', maxHeight: '120px' }}>{JSON.stringify(selectedNode.event.content, null, 2)}</pre>}
            </div>
          ) : (
            <div style={{ fontSize: '12px' }}>
              <div><strong>node_type:</strong> <Badge color={selectedNode.nodeType === 'Product' ? 'orange' : selectedNode.nodeType === 'Targeting' ? 'blue' : 'green'}>{selectedNode.nodeType}</Badge></div>
              <div style={{ marginTop: '4px' }}><strong>confidence:</strong> {(selectedNode.confidence * 100).toFixed(0)}%</div>
              {selectedNode.artifact_uri && <div style={{ marginTop: '4px' }}><strong>artifact_uri:</strong> <code style={{ fontSize: '10px' }}>{selectedNode.artifact_uri}</code></div>}
            </div>
          )}
        </Card>
      )}
    </div>
  );
};

// ============================================================
// World Change Detection Panel
// ============================================================

const WorldChangePanel = ({ session }) => {
  const wc = session.worldChange;
  const bgColor = wc.check_failed ? C.red[50] : wc.is_safe ? C.green[50] : C.yellow[50];
  const borderColor = wc.check_failed ? C.red[100] : wc.is_safe ? C.green[100] : C.yellow[100];
  const statusColor = wc.check_failed ? C.red[500] : wc.is_safe ? C.green[500] : C.yellow[600];
  const statusText = wc.check_failed ? 'CHECK FAILED (Fail-Closed)' : wc.is_safe ? 'Safe to Approve' : `${wc.stale} Stale Entities Detected`;
  const statusIcon = wc.check_failed ? 'X' : wc.is_safe ? '\u2713' : '\u26A0';

  return (
    <Card title="World Change Detection" subtitle="Pre-HITL safety check for long-running A2A tasks">
      <div style={{ padding: '16px', background: bgColor, borderRadius: '8px', border: `1px solid ${borderColor}`, marginBottom: '12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
          <div style={{ width: '40px', height: '40px', borderRadius: '50%', background: statusColor, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 'bold', fontSize: '18px' }}>{statusIcon}</div>
          <div>
            <div style={{ fontWeight: 600, color: statusColor, fontSize: '14px' }}>{statusText}</div>
            <div style={{ fontSize: '12px', color: C.grey[500], marginTop: '2px' }}>
              {wc.check_failed ? 'Query or state check failed. Report should NOT be used for HITL approval.' : `${wc.total} entities checked | Session: ${session.id}`}
            </div>
          </div>
        </div>
      </div>

      {wc.alerts.length > 0 && (
        <div>
          <h4 style={{ fontSize: '13px', marginBottom: '8px', color: C.grey[700] }}>Drift Alerts</h4>
          {wc.alerts.map((a, i) => (
            <div key={i} style={{ padding: '12px', background: C.red[50], borderRadius: '6px', marginBottom: '8px', border: `1px solid ${C.red[100]}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <strong style={{ color: C.red[600] }}>{a.biz_node}</strong>
                <Badge color="red">{a.drift_type}</Badge>
              </div>
              <div style={{ fontSize: '12px', color: C.grey[600], marginTop: '4px' }}>
                {a.original} &rarr; <strong>{a.current}</strong>
              </div>
              <div style={{ fontSize: '11px', color: C.grey[500], marginTop: '4px' }}>
                Severity: <span style={{ color: a.severity > 0.8 ? C.red[500] : C.yellow[600], fontWeight: 600 }}>{(a.severity * 100).toFixed(0)}%</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {wc.check_failed && (
        <div style={{ padding: '12px', background: C.red[50], borderRadius: '6px', border: `1px solid ${C.red[100]}` }}>
          <div style={{ fontSize: '12px', color: C.red[600] }}>
            <strong>Fail-Closed Semantics:</strong> The SDK returns <code>is_safe_to_approve=False</code> and <code>check_failed=True</code> when the underlying BigQuery query fails. This prevents operational failures from being misreported as "safe to approve."
          </div>
        </div>
      )}
    </Card>
  );
};

const SDKCodePanel = ({ session }) => {
  const code = `from bigquery_agent_analytics import Client, ContextGraphConfig

# Initialize SDK
client = Client(project_id="my-project", dataset_id="agent_analytics")
cgm = client.context_graph(config=ContextGraphConfig(
    endpoint="gemini-3-flash-preview",
))

# Step 1: Extract business entities (AI.GENERATE + output_schema)
biz_nodes = cgm.extract_biz_nodes(
    session_ids=["${session.id}"],
    use_ai_generate=True,  # Server-side extraction
)
print(f"Extracted {len(biz_nodes)} entities")

# Step 2: Create cross-links (tech events -> biz entities)
cgm.create_cross_links(["${session.id}"])

# Step 3: Create Property Graph (4-pillar architecture)
cgm.create_property_graph()

# Step 4: GQL trace reconstruction (replaces recursive CTEs)
trace = client.get_session_trace_gql(session_id="${session.id}")
trace.render()  # Hierarchical DAG view

# Step 5: Explain a decision via GQL traversal
chain = cgm.explain_decision(
    biz_entity="${session.bizNodes[0]?.node_value}",
    decision_event_type="HITL_CONFIRMATION_REQUEST_COMPLETED",
)

# Step 6: World Change Detection (fail-closed)
report = cgm.detect_world_changes(
    session_id="${session.id}",
    current_state_fn=check_inventory_availability,
)
print(report.summary())
# report.is_safe_to_approve  # ${session.worldChange.is_safe}
# report.check_failed         # ${session.worldChange.check_failed}`;

  return (
    <Card title="Python SDK Usage" subtitle="bigquery_agent_analytics.ContextGraphManager">
      <pre style={{ margin: 0, padding: '16px', background: '#1e1e1e', borderRadius: '8px', color: '#d4d4d4', fontSize: '11px', lineHeight: '1.6', fontFamily: "'Roboto Mono', monospace", overflow: 'auto', maxHeight: '500px' }}>{code}</pre>
    </Card>
  );
};

  const query = SQL_TEMPLATES[activeQuery];

  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', flexWrap: 'wrap' }}>
        {Object.entries(SQL_TEMPLATES).map(([key, q]) => (
          <Badge key={key} color={activeQuery === key ? 'blue' : 'grey'} onClick={() => setActiveQuery(key)}>{q.name}</Badge>
        ))}
      </div>
      <Card style={{ marginBottom: '16px', padding: '16px' }}>
        <h4 style={{ margin: '0 0 8px 0', fontSize: '14px' }}>{query.name}</h4>
        <div style={{ display: 'flex', gap: '8px' }}>
          <Badge color={query.category === 'Graph' ? 'purple' : query.category === 'Safety' ? 'red' : 'green'}>{query.category}</Badge>
          {query.sql.includes('AI.GENERATE') && <Badge color="purple">AI.GENERATE</Badge>}
          {query.sql.includes('output_schema') && <Badge color="orange">output_schema</Badge>}

  const [activeTab, setActiveTab] = useState('graph');
  const [activeSession, setActiveSession] = useState(0);
  const session = ADCP_SESSIONS[activeSession];

  return (
    <div style={{ fontFamily: "'Google Sans', 'Roboto', sans-serif", background: C.grey[50], minHeight: '100vh' }}>
      <header style={{ background: 'white', borderBottom: `1px solid ${C.grey[200]}`, padding: '12px 24px', display: 'flex', alignItems: 'center', gap: '16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
          <div style={{ width: '40px', height: '40px', background: `linear-gradient(135deg, ${C.blue[500]}, ${C.green[500]})`, borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 'bold', fontSize: '16px' }}>BQ</div>
          <div>
            <h1 style={{ margin: 0, fontSize: '18px', color: C.grey[900] }}>Context Graph V2 Demo</h1>
            <p style={{ margin: 0, fontSize: '11px', color: C.grey[500] }}>System of Reasoning for Agentic Ads (ADCP)</p>
          </div>
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: '8px' }}>

          <Badge color="green">AI.GENERATE + output_schema</Badge>

        </div>
      </header>

      <nav style={{ background: 'white', borderBottom: `1px solid ${C.grey[200]}`, paddingLeft: '24px', display: 'flex', overflow: 'auto' }}>
        <Tab active={activeTab === 'graph'} onClick={() => setActiveTab('graph')} icon="&#x1F517;">Property Graph</Tab>
        <Tab active={activeTab === 'world'} onClick={() => setActiveTab('world')} icon="&#x1F6E1;">World Change</Tab>
        <Tab active={activeTab === 'queries'} onClick={() => setActiveTab('queries')} icon="&#x1F4BE;">SQL / GQL</Tab>
        <Tab active={activeTab === 'sdk'} onClick={() => setActiveTab('sdk')} icon="&#x1F40D;">Python SDK</Tab>
      </nav>

      <main style={{ padding: '24px', maxWidth: '1400px', margin: '0 auto' }}>

        <Card style={{ marginBottom: '20px', padding: '16px' }}>
          <div style={{ display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '13px', fontWeight: 500, color: C.grey[700] }}>ADCP Session:</span>
            {ADCP_SESSIONS.map((s, i) => (

        {activeTab === 'graph' && (

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
              <Card title="Extracted Business Entities" subtitle={`${session.bizNodes.length} entities via AI.GENERATE + output_schema`}>
                <div style={{ overflow: 'auto', maxHeight: '300px' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
                    <thead><tr style={{ background: C.grey[50] }}>

        {activeTab === 'world' && <WorldChangePanel session={session} />}
        {activeTab === 'queries' && <QueryExplorer />}
        {activeTab === 'sdk' && <SDKCodePanel session={session} />}

        <Card style={{ marginTop: '24px', background: C.blue[50], border: `1px solid ${C.blue[100]}` }}>
          <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start', padding: '16px' }}>
            <span style={{ fontSize: '24px' }}>&#x1F4A1;</span>
            <div>
              <h4 style={{ margin: '0 0 8px 0', color: C.blue[600] }}>Context Graph V2 - Key Features</h4>

        </Card>

      <footer style={{ padding: '16px 24px', borderTop: `1px solid ${C.grey[200]}`, background: 'white', textAlign: 'center', color: C.grey[500], fontSize: '12px' }}>

}

ReactDOM.render(<App />, document.getElementById('root'));
  </script>
