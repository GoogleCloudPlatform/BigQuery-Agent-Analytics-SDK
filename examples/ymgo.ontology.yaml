ontology: YMGO_Context_Graph_V5
entities:
  - name: mako_DecisionPoint
    keys:
      primary: [decision_id]
    properties:
      - name: decision_id
        type: string
      - name: decision_type
        type: string

  - name: sup_YahooAdUnit
    keys:
      primary: [adUnitId]
    properties:
      - name: adUnitId
        type: string
      - name: adUnitName
        type: string
      - name: adUnitSize
        type: string
      - name: adUnitPosition
        type: string

  - name: mako_RejectionReason
    keys:
      primary: [rejection_id]
    properties:
      - name: rejection_id
        type: string
      - name: rejectionType
        type: string
      - name: rejectionRule
        type: string

relationships:
  - name: CandidateEdge
    from: mako_DecisionPoint
    to: sup_YahooAdUnit
    properties:
      - name: edge_type
        type: string
      - name: mako_scoreValue
        type: double

  - name: ForCandidate
    from: mako_RejectionReason
    to: sup_YahooAdUnit

  - name: sup_YahooAdUnitEvolvedFrom
    from: sup_YahooAdUnit
    to: sup_YahooAdUnit
    properties:
      - name: from_session_id
        type: string
      - name: to_session_id
        type: string
      - name: event_time
        type: timestamp
      - name: changed_properties
        type: string
