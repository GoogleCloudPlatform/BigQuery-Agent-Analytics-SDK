# Wall-clock half of the external-access attestation contract (#445): the
# unit tests enforce the attestation's internal consistency but never compare
# its dates to today, so this scheduled run is what makes the monthly manual
# canary recur. When next_due_date has passed it opens (or bumps) a tracking
# issue and fails, making the staleness visible without touching any
# credentialed API.

name: External access attestation staleness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  attestation-staleness:
    name: next_due_date has not passed
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install "pyyaml>=6.0"

      - name: Check attestation staleness
        id: staleness
        run: |
          if message=$(python3 scripts/check_external_access_staleness.py 2>&1); then
            echo "$message"
          else
            echo "$message"
            printf 'message<<EOF\n%s\nEOF\n' "$message" >> "$GITHUB_OUTPUT"
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or bump the tracking issue
        if: steps.staleness.outputs.overdue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.staleness.outputs.message }}
        run: |
          title="External access attestation overdue (report_template.yaml)"
          body="$MESSAGE

          Protocol: dashboard/looker_studio/bindings/report_template.yaml -> external_access_verification. Context: #445."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "$body" --label bug
          fi
          exit 1
