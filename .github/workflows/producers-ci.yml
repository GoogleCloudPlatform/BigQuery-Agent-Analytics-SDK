name: Producers CI

on:
  push:
    branches: [main]
    paths:
      - 'producers/**'
      - 'plugins/claude_code/**'
      - 'deploy/otlp_receiver/**'
      - '.dockerignore'
      - '.github/workflows/producers-ci.yml'
      - '.github/workflows/release-tracing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'producers/**'
      - 'plugins/claude_code/**'
      - 'deploy/otlp_receiver/**'
      - '.dockerignore'
      - '.github/workflows/producers-ci.yml'
      - '.github/workflows/release-tracing.yml'

# Least privilege: all jobs are build/test only.
permissions:
  contents: read

concurrency:
  group: producers-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: producers

jobs:
  format:
    name: Producers format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install formatting tools
        run: pip install "pyink>=24.3.0" "isort>=5.0"

      - name: isort --check
        run: isort --check-only src/ tests/ scripts/

      - name: pyink --check
        run: pyink --check src/ tests/ scripts/

  test:
    name: Producers test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,receiver]"  # receiver: protobuf path must run in PR CI, not only at tag time

      - name: Run tests
        run: pytest --tb=short -q

  build:
    name: Producers build
    runs-on: ubuntu-latest
    needs: [format, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        # Same hash-locked toolchain + no-isolation path the RELEASE
        # anchor build uses — a lock/backend incompatibility must fail in
        # PR CI, not first at tag time (#356 round 6).
        run: pip install --require-hashes -r build-requirements.lock

      - name: Build sdist and wheel (no isolation — locked backend)
        run: python -m build --no-isolation

      - name: List wheel/sdist
        run: ls -la dist/

      - name: Install built wheel for plugin build
        # Make `importlib.metadata.version` resolve correctly so the
        # plugin manifest gets a real version stamped in, not the
        # pyproject fallback.
        run: pip install --no-deps dist/bigquery_agent_analytics_tracing-*.whl

      - name: Build Claude Code plugin artifact
        run: python scripts/build_claude_plugin.py

      - name: List plugin artifact
        run: ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: producers-dist
          path: producers/dist/

  image-selftest:
    name: Receiver image self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Repo root: the Dockerfile requires the repository root as its
        # build context (unlike the other jobs, which run in producers/).
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Build the receiver image (hash-locked deps)
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('producers/pyproject.toml','rb'))['project']['version'])")
          docker build -f deploy/otlp_receiver/Dockerfile -t bqaa-pr-selftest .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run the checked-in self-test (same script the release runs)
        run: bash deploy/otlp_receiver/selftest.sh bqaa-pr-selftest "$VERSION"

  lock-drift:
    name: Hash-lock drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Regenerate locks with the exact pinned generator
        run: bash deploy/otlp_receiver/regen-locks.sh
      - name: Locks must match the reviewed files (all three)
        run: |
          git diff --exit-code deploy/otlp_receiver/pip-tools.lock \
            deploy/otlp_receiver/requirements.lock \
            producers/build-requirements.lock \
            || (echo "::error::checked-in locks drift from regen-locks.sh output — regenerate and review" && exit 1)
