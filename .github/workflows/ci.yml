name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue merges a group of pull requests only once the required
  # checks pass on the group's commit, and only this event runs them there.
  merge_group:
    types: [checks_requested]

# Least privilege: no job here needs write access to repo contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-22.04
    steps:
      # Full history: the sync_generation check below reads the binding at
      # an earlier commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject SDLC working notes (intent.md / plan.md / spec.md)
        run: |
          found="$(find . -path ./.git -prune -o -type f \( -name intent.md -o -name plan.md -o -name spec.md \) -print)"
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::intent.md / plan.md / spec.md must not be checked in. Keep SDLC working notes outside this repo."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install formatting tools
        run: pip install "pyink>=24.3.0,<26" "isort>=5.0"

      - name: Run autoformat and check for changes
        run: |
          bash autoformat.sh
          if ! git diff --exit-code src/ tests/ examples/ scripts/ dashboards/; then
            echo ""
            echo "::error::Code is not formatted. Run 'bash autoformat.sh' and commit the changes."
            exit 1
          fi

      - name: Check codelab notebook is in sync with markdown source
        run: |
          python scripts/generate_colab_from_codelab.py --check \
            docs/codelabs/periodic_materialization.md \
            examples/context_graph/codelab/colab_notebook.ipynb

      - name: Install PyYAML
        run: pip install "pyyaml>=6.0"

      # A committed receipt records one sync generation. Comparing with the
      # binding on the base branch (or the merge group's base, or before this
      # push) keeps a change from moving the generation back to one whose
      # receipt it still holds. This is the only check that does, so it runs
      # in this job: Format check is a required status check, and a failure
      # here blocks the merge. A merge group has neither BASE_REF nor BEFORE,
      # so it compares with its base_sha, which every group has. The step
      # skips only a push with nothing before it (BEFORE empty or all zeros)
      # and a previous commit without the binding; a merge base, a merge
      # group's base_sha or a BEFORE commit that this clone cannot find fails
      # it. tests/test_ci_workflow.py runs this script.
      - name: Check that sync_generation only moves forward
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          binding=dashboards/looker_studio/bindings/bqca_report_template.yaml
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            if [ -z "${MERGE_GROUP_BASE//0/}" ] || ! git cat-file -e "$MERGE_GROUP_BASE^{commit}" 2>/dev/null; then
              echo "::error::cannot compare $binding with the merge group's base: base_sha '$MERGE_GROUP_BASE' is not a commit in this clone"
              exit 1
            fi
            previous="$MERGE_GROUP_BASE"
          elif [ -n "$BASE_REF" ]; then
            if ! previous="$(git merge-base HEAD "origin/$BASE_REF")"; then
              echo "::error::cannot compare $binding with the base branch: no merge base of HEAD and origin/$BASE_REF in this clone"
              exit 1
            fi
          elif [ -z "${BEFORE//0/}" ]; then
            echo "no previous $binding to compare with"
            exit 0
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            previous="$BEFORE"
          else
            echo "::error::cannot compare $binding with the commit before this push: $BEFORE is not in this clone"
            exit 1
          fi
          if ! git cat-file -e "$previous:$binding" 2>/dev/null; then
            echo "no $binding at $previous to compare with"
            exit 0
          fi
          git show "$previous:$binding" > "$RUNNER_TEMP/previous-binding.yaml"
          python dashboards/looker_studio/tools/validate_contracts.py --profile bqca \
            --previous-binding "$RUNNER_TEMP/previous-binding.yaml"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,streamlit]"

      - name: Run tests
        run: pytest --tb=short -q

  configurator-browser-smoke:
    name: Configurator browser smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Run the smoke check's own negative fixtures
        run: bash dashboards/looker_studio/tools/browser_smoke.sh --self-test

      - name: Load the configurator in headless Chrome
        run: bash dashboards/looker_studio/tools/browser_smoke.sh

  build:
    name: Build package
    runs-on: ubuntu-22.04
    needs: [format, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: ${VERSION}"
          ls -la dist/
          ls dist/ | grep "${VERSION}" || (echo "Version mismatch in built artifacts" && exit 1)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
