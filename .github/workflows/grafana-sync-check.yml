name: Grafana query sync check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  grafana-query-sync:
    name: Dashboard queries match SQL sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate dashboard JSON and embedded queries
        run: python3 scripts/check_grafana_queries_sync.py
