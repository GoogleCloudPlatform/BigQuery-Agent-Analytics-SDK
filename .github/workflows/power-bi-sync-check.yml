name: Power BI sync check

on:
  push:
    branches: [main]
    paths:
      - "dashboards/power_bi/**"
      - "dashboards/looker_studio/spec/**"
      - "dashboards/looker_studio/sql/events_v1.sql.tmpl"
      - "dashboards/looker_studio/oracle/queries/**"
      - "tests/test_power_bi_*.py"
      - "pyproject.toml"
      - ".github/workflows/power-bi-sync-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboards/power_bi/**"
      - "dashboards/looker_studio/spec/**"
      - "dashboards/looker_studio/sql/events_v1.sql.tmpl"
      - "dashboards/looker_studio/oracle/queries/**"
      - "tests/test_power_bi_*.py"
      - "pyproject.toml"
      - ".github/workflows/power-bi-sync-check.yml"
  # A merge queue merges a group of pull requests only once the required
  # checks pass on the group's commit, and only this event runs them there.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  power-bi-sync:
    name: Power BI project is in sync and valid
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Exact versions: validator behavior must only change through a
        # repository diff, like the SHA-pinned actions and schema lock.
        run: pip install "pyyaml==6.0.2" "jsonschema==4.23.0" "pytest==8.3.4"

      - name: Check generated files are in sync
        run: |
          python3 dashboards/power_bi/tools/generate_pbip.py --check

      - name: Fetch pinned PBIR schemas
        run: |
          python3 dashboards/power_bi/tools/validate_pbip.py \
            --fetch-schemas "$RUNNER_TEMP/pbir-schemas"

      - name: Validate against pinned schemas
        run: |
          python3 dashboards/power_bi/tools/validate_pbip.py \
            --schemas-dir "$RUNNER_TEMP/pbir-schemas"

      - name: Run Power BI tests
        env:
          BQAA_POWER_BI_SCHEMAS_DIR: ${{ runner.temp }}/pbir-schemas
        run: |
          pytest --tb=short -q tests/test_power_bi_*.py
