# Releases the coding-agent mod in plugins/claude_code_mod.
#
# Trigger: push a `mod-vX.Y.Z` tag whose version is the mod's
# .claude-plugin/plugin.json version (tests/version.test.sh holds the code's
# PLUGIN_VERSION to the same). The mod-v namespace is apart from the SDK's
# `vX.Y.Z` and the tracing plugin's `tracing-vX.Y.Z`, so the pipelines never
# collide.
#
#   verify   - the tag points at the current protected-main head, its
#              version is plugin.json's, and the checks Mod CI runs pass.
#   build    - build_dist.sh into bigquery-agent-analytics-mod-X.Y.Z/, a
#              reproducible archive of it
#              (bigquery-agent-analytics-mod-X.Y.Z.tar.gz) and SHA256SUMS.
#   release  - a DRAFT pre-release with both files. A maintainer publishes
#              it, then syncs plugins/claude_code_dist/bigquery-agent-analytics-mod
#              from the archive and bumps the catalog entry
#              (plugins/claude_code_dist/README.md has the routine). An
#              organization that deploys the mod from a folder copies the
#              archive and checks it against SHA256SUMS.

name: Release mod

on:
  push:
    tags:
      - 'mod-v*'

permissions: {}

concurrency:
  group: release-mod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag, the version and the tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is the current protected-main head
        run: |
          git fetch origin main --quiet
          MAIN_HEAD=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$MAIN_HEAD" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, but origin/main is at ${MAIN_HEAD}: cut release tags from the current head"
            exit 1
          fi

      - name: The tag's version is plugin.json's
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('plugins/claude_code_mod/.claude-plugin/plugin.json'))['version'])")
          if [ "${GITHUB_REF_NAME}" != "mod-v${VERSION}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, but plugin.json has ${VERSION} (expected mod-v${VERSION})"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: The checks Mod CI runs
        working-directory: plugins/claude_code_mod
        run: |
          bash build_dist.sh --check
          bash tests/build_dist.test.sh
          bash tests/setup.test.sh
          bash tests/version.test.sh
          node tests/reload.test.mjs
          python -m pip install duckdb==1.5.6
          python tests/views.test.py

  build:
    name: Build the archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Build, archive and checksum
        run: |
          NAME="bigquery-agent-analytics-mod-${VERSION}"
          mkdir -p out
          bash plugins/claude_code_mod/build_dist.sh "out/${NAME}"
          EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${EPOCH}" \
            -C out -cf - "${NAME}" | gzip -n > "out/${NAME}.tar.gz"
          (cd out && sha256sum "${NAME}.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mod-release
          path: |
            out/*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error

  release:
    name: Draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, build]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: mod-release
          path: out

      - name: Draft a pre-release with the archive and its checksum
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --draft --prerelease --latest=false \
            --title "Coding-agent mod ${VERSION}" \
            --notes "The coding-agent mod (plugins/claude_code_mod) at ${VERSION}, early access. Install it from the bqaa-tracing marketplace; organizations deploying a folder copy this archive and check it against SHA256SUMS." \
            out/*.tar.gz out/SHA256SUMS
