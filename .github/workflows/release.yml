              --hash=sha256:ac1bbe05fd2991f160ebce24ffbac5f6d11d83dc90891255885223d42b3cd931
          EOF
          python -m pip install --require-hashes --no-deps -r twine-requirements.lock
          rm -f twine-requirements.lock

      - name: Set up Cloud SDK (pinned version, BEFORE credentials exist)
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          version: '509.0.0'

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Clean up failed staging attempt for this exact version (if any)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Only clean up this exact version if a prior attempt uploaded to
          # Artifact Registry and failed before submitting its manifest.
          # Never delete the package or touch any other release's version.
          set +e
          PENDING=$(gcloud storage ls             "gs://oss-exit-gate-prod-projects-bucket/bigquery-agent-analytics/pypi/manifests/manifest-${VERSION}-*.json"             2> ls.err)
          LS_RC=$?
          set -e
          if [ $LS_RC -eq 0 ] && [ -n "${PENDING}" ]; then
            echo "Manifest for version ${VERSION} already submitted (${PENDING}) — skipping staging cleanup"
            echo "skip_stage=true" >> "$GITHUB_ENV"
            exit 0
          elif [ $LS_RC -ne 0 ] && ! grep -qi "matched no objects" ls.err; then
            cat ls.err >&2
            exit $LS_RC
          fi

          set +e
          gcloud artifacts versions describe "${VERSION}"             --package="bigquery-agent-analytics"             --project="oss-exit-gate-prod"             --location="us"             --repository="bigquery-agent-analytics--pypi"             --format="value(name)" > /dev/null 2> describe.err
          DESC_RC=$?
          set -e
          if [ $DESC_RC -eq 0 ]; then
            echo "Deleting incomplete staged version ${VERSION} before retry..."
            gcloud artifacts versions delete "${VERSION}"               --package="bigquery-agent-analytics"               --project="oss-exit-gate-prod"               --location="us"               --repository="bigquery-agent-analytics--pypi"               --quiet
          elif grep -Eqi "NOT_FOUND:.*(Version|versions/${VERSION}|Package|packages/bigquery-agent-analytics)" describe.err; then
            echo "Version ${VERSION} not present in staging repository — proceeding with fresh upload"
          else
            cat describe.err >&2
            exit $DESC_RC
          fi

      - name: Stage distributions to OSS Exit Gate and upload manifest
        if: env.skip_stage != 'true'
        env:
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python -m twine upload             --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/bigquery-agent-analytics--pypi/"             -u oauth2accesstoken             -p "$(gcloud auth print-access-token)"             dist/*
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "bigquery-agent-analytics",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json             "gs://oss-exit-gate-prod-projects-bucket/bigquery-agent-analytics/pypi/manifests/manifest-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-22.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
