name: Release to PyPI

on:
  release:
    types: [published]

# Least privilege at workflow level; the publish jobs opt in to
# `id-token: write` individually for PyPI trusted publishing.
permissions:
  contents: read

# The release event has no tag-pattern filter, so any published
# release fires this workflow. The producer pipeline publishes
# `tracing-vX.Y.Z` releases (release-tracing.yml); without this
# guard, every producer release would also trigger root SDK
# publishing and fail version verification.
#
# Root SDK tags use the plain `vX.Y.Z` pattern; producer tags use
# `tracing-vX.Y.Z`. Only the root pattern starts with literal `v`,
# so this is an unambiguous boundary.
jobs:
  build:
    name: Build package
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package version matches release tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "Package version: ${VERSION}"
          echo "Release tag:     ${TAG}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::Version mismatch: pyproject.toml has ${VERSION} but release tag is ${TAG}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-22.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
