# Report-only mutation testing (scripts/mutation_testing.py, see
# docs/mutation_testing.md). Weekly and on demand only: it never runs on pull
# requests and is not a required check. Surviving mutants are published to the
# job summary and the mutation-report artifact; they never fail the run, and
# neither does a mutmut failure (continue-on-error). No cloud credentials: the
# selected tests mock BigQuery.

name: Mutation testing (report-only)

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation report (non-gating)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install package, test and mutation dependencies
        run: pip install -e ".[dev]" -r scripts/requirements-mutation.txt

      - name: Run mutation testing (report-only)
        continue-on-error: true
        run: python scripts/mutation_testing.py --time-budget-minutes 20

      - name: Publish the report to the job summary
        if: always()
        run: |
          report=build/mutation/report/mutation_report.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No mutation report was written; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mutation-report
          path: build/mutation/report/
          if-no-files-found: warn
          retention-days: 30
